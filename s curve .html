<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد کنترل پروژه - سال ۱۴۰۴</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    
    <style>
        /* Custom styles for the app */
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
        /* Custom scrollbar for modal in dark mode */
        .dark .modal-scrollbar::-webkit-scrollbar { width: 8px; }
        .dark .modal-scrollbar::-webkit-scrollbar-track { background-color: #1f2937; }
        .dark .modal-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 10px; border: 2px solid #1f2937; }
        .dark .modal-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #6b7280; }
    </style>
</head>

<body class="transition-colors duration-300">
    <div id="dashboard-to-print" class="min-h-screen p-4 sm:p-6">
        <div class="max-w-8xl mx-auto">
            <header class="rounded-2xl shadow-md p-5 mb-6 flex flex-col sm:flex-row items-center justify-between">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold">داشبورد کنترل پروژه - سال ۱۴۰۴</h1>
                    <p class="text-base font-semibold mt-1">اجرای بخشی از سازه نگهبان ۱۰ ایستگاه غربی | حفاری تونل: ۲,۱۶۱ متر طول</p>
                </div>
                <div id="action-buttons" class="flex items-center space-x-2 space-x-reverse mt-4 sm:mt-0">
                    <button id="theme-toggle" class="flex items-center space-x-2 space-x-reverse px-3 py-2 rounded-lg transition-colors">
                    </button>
                    <input type="file" id="file-import" class="hidden" accept=".json" />
                    <button id="import-btn" class="flex items-center space-x-2 space-x-reverse px-3 py-2 rounded-lg transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px]"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span>بارگذاری</span>
                    </button>
                    <button id="export-btn" class="flex items-center space-x-2 space-x-reverse px-3 py-2 rounded-lg transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px]"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        <span>ذخیره</span>
                    </button>
                    <button id="settings-btn" class="flex items-center space-x-2 space-x-reverse px-3 py-2 rounded-lg transition-colors">
                         <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px]"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 0 2l-.15.08a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l-.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1 0-2l.15-.08a2 2 0 0 0 .73 2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span>تنظیمات</span>
                    </button>
                    <button id="print-btn" class="flex items-center space-x-2 space-x-reverse bg-indigo-600 text-white px-3 py-2 rounded-lg hover:bg-indigo-500 transition-colors disabled:bg-indigo-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px]"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                        <span>چاپ</span>
                    </button>
                </div>
            </header>
            
            <div id="stat-cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6 mb-6">
            </div>
            
            <div id="summary-panel-container" class="mb-6">
            </div>

            <div class="grid grid-cols-1 gap-6">
                <div id="chart-panel-main" class="rounded-2xl shadow-md p-6 h-[450px]">
                    <h3 class="text-xl font-bold mb-4">تحلیل ارزش کسب شده (EVM) و دریافتی‌ها</h3>
                    <canvas id="mainChartCanvas"></canvas>
                </div>
                
                <div id="expert-analysis-panel" class="rounded-2xl shadow-md p-6">
                </div>

                <div id="data-table-panel" class="rounded-2xl shadow-md p-6">
                </div>
            </div>
            
            <footer class="mt-8 rounded-2xl shadow-md p-4 text-center">
                <p class="font-semibold">مدیریت فنی و مهندسی پروژه خط 10 مترو تهران</p>
            </footer>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 hidden" dir="rtl">
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA STORE ---
            let config = {
                assumptions: {
                    tunnelBudgetPerMeter: 0.80, 
                    tunnelActualCostPerMeter: 0.85,
                    stations: [
                        { id: 1, name: 'دریاچه', budget: 190, actualCost: 200 }, { id: 2, name: 'جنت آباد', budget: 190, actualCost: 200 }, { id: 3, name: 'اتریش', budget: 190, actualCost: 200 }, { id: 4, name: 'پژوهش', budget: 190, actualCost: 200 }, { id: 5, name: 'المپیک', budget: 190, actualCost: 200 }, { id: 6, name: 'ساحل', budget: 190, actualCost: 200 }, { id: 7, name: 'موج', budget: 190, actualCost: 200 }, { id: 8, name: 'کوهسار', budget: 190, actualCost: 200 }, { id: 9, name: 'سردار جنگل', budget: 190, actualCost: 200 }, { id: 10, name: 'ایرانشهر', budget: 190, actualCost: 200 },
                    ]
                },
                baselinePlan: [
                     { month: 'فروردین', tunnelMeters: 10, stationProgress: { 1: 2, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 2, 8: 2, 9: 2, 10: 2 }, miscellaneousCost: 2 },
                     { month: 'اردیبهشت', tunnelMeters: 30, stationProgress: { 1: 5, 2: 5, 3: 5, 4: 5, 5: 5, 6: 5, 7: 5, 8: 5, 9: 5, 10: 5 }, miscellaneousCost: 2 },
                     { month: 'خرداد', tunnelMeters: 150, stationProgress: { 1: 10, 2: 10, 3: 10, 4: 10, 5: 10, 6: 10, 7: 10, 8: 10, 9: 10, 10: 10 }, miscellaneousCost: 5 },
                     { month: 'تیر', tunnelMeters: 160, stationProgress: { 1: 15, 2: 15, 3: 15, 4: 15, 5: 15, 6: 15, 7: 15, 8: 15, 9: 15, 10: 15 }, miscellaneousCost: 5 },
                     { month: 'مرداد', tunnelMeters: 140, stationProgress: { 1: 20, 2: 20, 3: 20, 4: 20, 5: 20, 6: 20, 7: 20, 8: 20, 9: 20, 10: 20 }, miscellaneousCost: 4 },
                     { month: 'شهریور', tunnelMeters: 60, stationProgress: { 1: 25, 2: 25, 3: 25, 4: 25, 5: 25, 6: 25, 7: 25, 8: 25, 9: 25, 10: 25 }, miscellaneousCost: 3 },
                     { month: 'مهر', tunnelMeters: 0, stationProgress: { 1: 25, 2: 25, 3: 25, 4: 25, 5: 25, 6: 25, 7: 25, 8: 25, 9: 25, 10: 25 }, miscellaneousCost: 0 },
                     { month: 'آبان', tunnelMeters: 0, stationProgress: { 1: 25, 2: 25, 3: 25, 4: 25, 5: 25, 6: 25, 7: 25, 8: 25, 9: 25, 10: 25 }, miscellaneousCost: 0 },
                     { month: 'آذر', tunnelMeters: 0, stationProgress: { 1: 25, 2: 25, 3: 25, 4: 25, 5: 25, 6: 25, 7: 25, 8: 25, 9: 25, 10: 25 }, miscellaneousCost: 0 },
                     { month: 'دی', tunnelMeters: 0, stationProgress: { 1: 25, 2: 25, 3: 25, 4: 25, 5: 25, 6: 25, 7: 25, 8: 25, 9: 25, 10: 25 }, miscellaneousCost: 0 },
                     { month: 'بهمن', tunnelMeters: 0, stationProgress: { 1: 25, 2: 25, 3: 25, 4: 25, 5: 25, 6: 25, 7: 25, 8: 25, 9: 25, 10: 25 }, miscellaneousCost: 0 },
                     { month: 'اسفند', tunnelMeters: 0, stationProgress: { 1: 25, 2: 25, 3: 25, 4: 25, 5: 25, 6: 25, 7: 25, 8: 25, 9: 25, 10: 25 }, miscellaneousCost: 0 },
                ],
                monthlyData: [ // Actual Progress & Invoicing
                     { month: 'فروردین', tunnelMeters: 0, stationProgress: { 1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 3, 7: 3, 8: 3, 9: 3, 10: 3 }, miscellaneousCost: 5, invoicedByNote: 20, invoicedByBarter: 20, invoicedByCash: 10 },
                     { month: 'اردیبهشت', tunnelMeters: 22, stationProgress: { 1: 6, 2: 6, 3: 6, 4: 6, 5: 6, 6: 6, 7: 6, 8: 6, 9: 6, 10: 6 }, miscellaneousCost: 10, invoicedByNote: 25, invoicedByBarter: 25, invoicedByCash: 15 },
                     { month: 'خرداد', tunnelMeters: 140, stationProgress: { 1: 9, 2: 9, 3: 9, 4: 9, 5: 9, 6: 9, 7: 9, 8: 9, 9: 9, 10: 9 }, miscellaneousCost: 20, invoicedByNote: 80, invoicedByBarter: 80, invoicedByCash: 40 },
                     { month: 'تیر', tunnelMeters: 161, stationProgress: { 1: 12, 2: 12, 3: 12, 4: 12, 5: 12, 6: 12, 7: 12, 8: 12, 9: 12, 10: 12 }, miscellaneousCost: 25, invoicedByNote: 90, invoicedByBarter: 90, invoicedByCash: 50 },
                     { month: 'مرداد', tunnelMeters: 131, stationProgress: { 1: 15, 2: 15, 3: 15, 4: 15, 5: 15, 6: 15, 7: 15, 8: 15, 9: 15, 10: 15 }, miscellaneousCost: 15, invoicedByNote: 70, invoicedByBarter: 70, invoicedByCash: 40 },
                     { month: 'شهریور', tunnelMeters: 52, stationProgress: { 1: 18, 2: 18, 3: 18, 4: 18, 5: 18, 6: 18, 7: 18, 8: 18, 9: 18, 10: 18 }, miscellaneousCost: 10, invoicedByNote: 65, invoicedByBarter: 65, invoicedByCash: 30 },
                     { month: 'مهر', tunnelMeters: 0, stationProgress: { 1: 18, 2: 18, 3: 18, 4: 18, 5: 18, 6: 18, 7: 18, 8: 18, 9: 18, 10: 18 }, miscellaneousCost: 0, invoicedByNote: 0, invoicedByBarter: 0, invoicedByCash: 0 },
                     { month: 'آبان', tunnelMeters: 0, stationProgress: { 1: 18, 2: 18, 3: 18, 4: 18, 5: 18, 6: 18, 7: 18, 8: 18, 9: 18, 10: 18 }, miscellaneousCost: 0, invoicedByNote: 0, invoicedByBarter: 0, invoicedByCash: 0 },
                     { month: 'آذر', tunnelMeters: 0, stationProgress: { 1: 18, 2: 18, 3: 18, 4: 18, 5: 18, 6: 18, 7: 18, 8: 18, 9: 18, 10: 18 }, miscellaneousCost: 0, invoicedByNote: 0, invoicedByBarter: 0, invoicedByCash: 0 },
                     { month: 'دی', tunnelMeters: 0, stationProgress: { 1: 18, 2: 18, 3: 18, 4: 18, 5: 18, 6: 18, 7: 18, 8: 18, 9: 18, 10: 18 }, miscellaneousCost: 0, invoicedByNote: 0, invoicedByBarter: 0, invoicedByCash: 0 },
                     { month: 'بهمن', tunnelMeters: 0, stationProgress: { 1: 18, 2: 18, 3: 18, 4: 18, 5: 18, 6: 18, 7: 18, 8: 18, 9: 18, 10: 18 }, miscellaneousCost: 0, invoicedByNote: 0, invoicedByBarter: 0, invoicedByCash: 0 },
                     { month: 'اسفند', tunnelMeters: 0, stationProgress: { 1: 18, 2: 18, 3: 18, 4: 18, 5: 18, 6: 18, 7: 18, 8: 18, 9: 18, 10: 18 }, miscellaneousCost: 0, invoicedByNote: 0, invoicedByBarter: 0, invoicedByCash: 0 },
                ],
            };

            let theme = 'dark';
            let mainChart;

            // --- DOM ELEMENTS ---
            const body = document.body;
            const statCardsContainer = document.getElementById('stat-cards-container');
            const summaryPanelContainer = document.getElementById('summary-panel-container');
            const dataTableContainer = document.getElementById('data-table-panel');
            const expertAnalysisContainer = document.getElementById('expert-analysis-panel');
            const modal = document.getElementById('edit-modal');
            const themeToggleButton = document.getElementById('theme-toggle');
            
            // --- UTILITY FUNCTIONS ---
            const calculateCumulative = (data) => data.reduce((acc, val, i) => [...acc, (acc[i - 1] || 0) + val], []);
            const getLast = arr => arr.length > 0 ? arr[arr.length - 1] : 0;
            const formatNumber = (num) => num.toLocaleString(undefined, { maximumFractionDigits: 2 });

            // --- DATA PROCESSING ---
            function getDashboardData() {
                const allMonthsData = config.monthlyData;
                const labels = allMonthsData.map(d => d.month);
                
                // MODIFIED: Added includeMiscCost parameter
                const calculateValueFromProgress = (progressData, useBudget = true, includeMiscCost = false) => {
                    return progressData.map((monthData, index) => {
                        const prevMonthData = index > 0 ? progressData[index - 1] : null;
                        const tunnelRate = useBudget ? config.assumptions.tunnelBudgetPerMeter : config.assumptions.tunnelActualCostPerMeter;
                        
                        const currentTunnelMeters = monthData.tunnelMeters;
                        const tunnelValue = currentTunnelMeters * tunnelRate;
                        
                        const stationValue = config.assumptions.stations.reduce((total, station) => {
                            const stationRate = useBudget ? station.budget : station.actualCost;
                            const currentProgress = monthData.stationProgress[station.id] || 0;
                            const prevProgress = prevMonthData ? (prevMonthData.stationProgress[station.id] || 0) : 0;
                            const progressDiff = currentProgress - prevProgress;
                            const value = (progressDiff / 100) * stationRate;
                            return total + value;
                        }, 0);

                        // MODIFIED: Use includeMiscCost flag to decide whether to add miscellaneous cost
                        const miscCost = includeMiscCost ? (monthData.miscellaneousCost || 0) : 0;
                        
                        return tunnelValue + stationValue + miscCost;
                    });
                };
                
                // MODIFIED: Updated function calls to include the new parameter
                const plannedValue = calculateValueFromProgress(config.baselinePlan, true, true); // PV includes planned misc costs
                const earnedValue = calculateValueFromProgress(allMonthsData, true, false); // EV is pure progress value, no misc costs
                const actualCost = calculateValueFromProgress(allMonthsData, false, true); // AC includes actual misc costs
                const totalInvoiced = allMonthsData.map(d => (d.invoicedByNote || 0) + (d.invoicedByBarter || 0) + (d.invoicedByCash || 0));

                const dataSeries = {
                    earnedValue: earnedValue,
                    plannedValue: plannedValue,
                    actualCost: actualCost,
                    invoicedByNote: allMonthsData.map(d => d.invoicedByNote),
                    invoicedByBarter: allMonthsData.map(d => d.invoicedByBarter),
                    invoicedByCash: allMonthsData.map(d => d.invoicedByCash),
                };
                
                const cumulativeSeries = {
                    cumulativeEV: calculateCumulative(dataSeries.earnedValue),
                    cumulativePV: calculateCumulative(dataSeries.plannedValue),
                    cumulativeAC: calculateCumulative(dataSeries.actualCost),
                    cumulativeInflow: calculateCumulative(totalInvoiced)
                };
                
                // This logic finds the last month with actual progress recorded.
                let lastReportedIndex = allMonthsData.map((d, i) => {
                    const progress = d.tunnelMeters + Object.values(d.stationProgress).reduce((a, b) => a + b, 0);
                    return progress > 0 ? i : -1;
                }).filter(i => i !== -1).pop() ?? -1;

                const totals = {
                    evTotal: getLast(cumulativeSeries.cumulativeEV),
                    pvTotal: getLast(cumulativeSeries.cumulativePV),
                    acTotal: getLast(cumulativeSeries.cumulativeAC),
                };
                
                const lastEV = cumulativeSeries.cumulativeEV[lastReportedIndex] || 0;
                const lastPV = cumulativeSeries.cumulativePV[lastReportedIndex] || 0;
                const lastAC = cumulativeSeries.cumulativeAC[lastReportedIndex] || 0;

                totals.sv = lastEV - lastPV;
                totals.cv = lastEV - lastAC;
                totals.spi = lastPV > 0 ? lastEV / lastPV : 1;
                totals.cpi = lastAC > 0 ? lastEV / lastAC : 1;

                return {
                    labels: labels,
                    datasets: { ...dataSeries, ...cumulativeSeries },
                    totals: totals,
                    allMonthsData: allMonthsData,
                    lastReportedIndex: lastReportedIndex // MODIFIED: Pass the index for chart styling
                };
            }

            // --- UI RENDERING ---
            function renderUI() {
                const data = getDashboardData();
                renderStatCards(data.totals);
                renderSummaryPanel(data.totals);
                renderExpertAnalysis(data);
                renderDataTable();
                renderCharts(data); // MODIFIED: Pass the whole data object
                applyTheme();
            }

            function renderStatCards(totals) {
                const cards = [
                    { title: "ارزش کسب شده (EV)", value: totals.evTotal, unit: "میلیارد تومان", color: "#f97316", icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>` },
                    { title: "هزینه واقعی (AC)", value: totals.acTotal, unit: "میلیارد تومان", color: "#ef4444", icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>` },
                    { title: "انحراف از برنامه (SV)", value: totals.sv, unit: "میلیارد تومان", color: totals.sv >= 0 ? '#0ea5e9' : '#f59e0b', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.17M19 22v-6"/><path d="M22 19l-3-3-3 3"/></svg>`},
                    { title: "شاخص عملکرد هزینه (CPI)", value: totals.cpi, unit: totals.cpi >= 1 ? 'سود' : 'زیان', color: totals.cpi >= 1 ? '#22c55e' : '#ef4444', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>` },
                    { title: "شاخص عملکرد زمانبندی (SPI)", value: totals.spi, unit: totals.spi >= 1 ? 'جلوتر از برنامه' : 'عقب از برنامه', color: totals.spi >= 1 ? '#22c55e' : '#f59e0b', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>` }
                ];

                statCardsContainer.innerHTML = cards.map(card => `
                    <div class="stat-card rounded-2xl shadow-md p-5">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium">${card.title}</p>
                                <p class="text-2xl font-bold">${formatNumber(card.value)}</p>
                                <p class="text-xs">${card.unit}</p>
                            </div>
                            <div class="p-3 rounded-full" style="background-color: ${card.color}20;">
                                <div class="w-7 h-7" style="color: ${card.color};">${card.icon}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            function renderSummaryPanel(totals) {
                const summary = `پروژه با شاخص عملکرد هزینه ${formatNumber(totals.cpi)} و زمانبندی ${formatNumber(totals.spi)} در حال اجراست.`;
                summaryPanelContainer.innerHTML = `
                    <div class="summary-panel rounded-2xl shadow-md p-5">
                        <div class="flex items-center gap-3">
                            <div class="p-3 rounded-full">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 text-blue-400"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold">تحلیل هوشمند وضعیت پروژه</h3>
                                <p>${summary}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderExpertAnalysis(data) {
                const { totals } = data;
                const spiStatus = totals.spi >= 1 ? `به میزان ${formatNumber((totals.spi - 1) * 100)}% جلوتر از برنامه` : `به میزان ${formatNumber((1 - totals.spi) * 100)}% عقب از برنامه`;
                const cpiStatus = totals.cpi >= 1 ? `به میزان ${formatNumber((totals.cpi - 1) * 100)}% سود` : `به میزان ${formatNumber((1 - totals.cpi) * 100)}% زیان`;
                
                let analysisHTML = `
                    <h3 class="text-xl font-bold mb-4">تحلیل کارشناسی وضعیت پروژه (EVM)</h3>
                    <div class="space-y-4 text-base leading-relaxed">
                        <p>

            function handleModalClick(e) {
                const target = e.target.closest('button');
                if (!target) return;

                if (target.id === 'close-modal-btn') closeModal();
                if (target.dataset.view) {
                    modalState.currentView = target.dataset.view;
                    renderModalContent();
                }
                if (target.id === 'add-station-btn') {
                    const newId = (modalState.tempAssumptions.stations.reduce((maxId, s) => Math.max(s.id, maxId), 0) || 0) + 1;
                    modalState.tempAssumptions.stations.push({ id: newId, name: 'ایستگاه جدید', budget: 0, actualCost: 0 });
                    renderModalContent();
                }
                 if (target.classList.contains('remove-station-btn')) {
                    const stationId = parseInt(target.closest('[data-station-id]').dataset.stationId);
                    modalState.tempAssumptions.stations = modalState.tempAssumptions.stations.filter(s => s.id !== stationId);
                    renderModalContent();

                if(target.id === 'add-month-btn') {
                    const dataArray = modalState.currentView === 'baseline' ? modalState.tempBaselinePlan : modalState.tempMonthlyData;
                    const newMonth = { month: 'ماه جدید', tunnelMeters: 0, stationProgress: {}, miscellaneousCost: 0, invoicedByNote: 0, invoicedByBarter: 0, invoicedByCash: 0 };
                    modalState.tempAssumptions.stations.forEach(s => newMonth.stationProgress[s.id] = 0);
                    dataArray.push(newMonth);
                    renderModalContent();
                }
                if(target.classList.contains('remove-month-btn')) {
                    const dataArray = modalState.currentView === 'baseline' ? modalState.tempBaselinePlan : modalState.tempMonthlyData; // Logic fix
                    const index = parseInt(target.dataset.monthIndex);
                    dataArray.splice(index, 1);
                    renderModalContent();
                }
                if (target.id === 'save-modal-btn') {
                    config.assumptions = JSON.parse(JSON.stringify(modalState.tempAssumptions));
                    config.baselinePlan = JSON.parse(JSON.stringify(modalState.tempBaselinePlan));
                    config.monthlyData = JSON.parse(JSON.stringify(modalState.tempMonthlyData));
                    
                    renderUI();
                    closeModal();
                }
                if (target.id === 'download-excel-btn') {
                    downloadExcelTemplate();
                }
                if (target.id === 'upload-excel-btn') {
                    document.getElementById('excel-upload-input').click();
                }
            }

            function handleModalInput(e) {
                const target = e.target;
                if (target.tagName !== 'INPUT') return;
                
                if(modalState.currentView === 'assumptions') {
                    if(target.classList.contains('assumption-input')) {
                         modalState.tempAssumptions[target.dataset.field] = parseFloat(target.value) || 0;
                    }
                    if(target.classList.contains('station-input')) {
                        const stationId = parseInt(target.closest('[data-station-id]').dataset.stationId);
                        const station = modalState.tempAssumptions.stations.find(s => s.id === stationId);
                        if(station) {
                            const field = target.dataset.field;
                            const value = field === 'name' ? target.value : parseFloat(target.value) || 0;
                            station[field] = value;
                        }
                    }
                } else { 
                    const dataArray = modalState.currentView === 'baseline' ? modalState.tempBaselinePlan : modalState.tempMonthlyData;
                    const monthIndex = parseInt(target.closest('[data-month-index]').dataset.monthIndex);
                    const monthData = dataArray[monthIndex];
                    if(!monthData) return;

                    if(target.classList.contains('station-progress-input')) {
                        const stationId = parseInt(target.dataset.stationId);
                        monthData.stationProgress[stationId] = parseFloat(target.value) || 0;
                    } else {
                        const field = target.dataset.field;
                        const value = field === 'month' ? target.value : parseFloat(target.value) || 0;
                        monthData[field] = value;
                    }
                }
            }

            // --- EXCEL FUNCTIONALITY ---
            function downloadExcelTemplate() {
                const stations = modalState.tempAssumptions.stations;
                const headers = [
                    'ماه', 'حفاری (متر)', ...stations.map(s => `${s.name} (%)`),
                    'هزینه متفرقه',
                    'صورت وضعیت (برات)', 'صورت وضعیت (تهاتر)', 'صورت وضعیت (نقدی)'
                ];
                
                const ws = XLSX.utils.aoa_to_sheet([headers]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "پیشرفت ماهانه");
                XLSX.writeFile(wb, "Template_Actual_Progress.xlsx");
            }

            function handleExcelUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    if (json.length < 2) {
                        alert("فایل اکسل خالی است یا فرمت صحیحی ندارد."); return;
                    }

                    const currentStations = modalState.tempAssumptions.stations;
                    const headers = json[0];
                    if(headers[0] !== 'ماه') {
                         alert("سرستون های فایل اکسل با قالب مورد انتظار مطابقت ندارد. لطفا ابتدا قالب را دانلود کنید.");
                         return;
                    }

                    const newData = json.slice(1).map(row => {
                        const newMonth = {
                            month: row[0] || 'نامشخص',
                            tunnelMeters: parseFloat(row[1]) || 0,
                            stationProgress: {},
                            miscellaneousCost: parseFloat(row[2 + currentStations.length]) || 0,
                            invoicedByNote: parseFloat(row[3 + currentStations.length]) || 0,
                            invoicedByBarter: parseFloat(row[4 + currentStations.length]) || 0,
                            invoicedByCash: parseFloat(row[5 + currentStations.length]) || 0,
                        };
                        currentStations.forEach((station, index) => {
                            newMonth.stationProgress[station.id] = parseFloat(row[2 + index]) || 0;
                        });
                        return newMonth;
                    });
                    
                    modalState.tempMonthlyData = newData;
                    renderModalContent();
                };
                reader.readAsArrayBuffer(file);
                event.target.value = '';
            }

            // --- EVENT LISTENERS ---
            themeToggleButton.addEventListener('click', () => {
                theme = theme === 'dark' ? 'light' : 'dark';
                renderUI();
            });

            document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-import').click());
            
            document.getElementById('file-import').addEventListener('change', (event) => {
                const fileReader = new FileReader();
                if (!event.target.files[0]) return;
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const newConfig = JSON.parse(e.target.result);
                        if (newConfig.assumptions && newConfig.monthlyData && newConfig.baselinePlan) {
                            config = newConfig;
                            renderUI();
                        } else {
                            alert("فایل JSON معتبر نیست.");
                        }
                    } catch (error) {
                        alert("خطا در خواندن فایل.");
                    }
                };
                event.target.value = '';
            });

            document.getElementById('export-btn').addEventListener('click', () => {
                const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(config, null, 2))}`;
                const link = document.createElement("a");
                link.href = jsonString;
                link.download = "project-control-config.json";
                link.click();
            });
            
            document.getElementById('settings-btn').addEventListener('click', openModal);
            modal.addEventListener('click', handleModalClick);
            modal.addEventListener('input', handleModalInput);
            document.body.addEventListener('change', (e) => {
                 if (e.target.id === 'excel-upload-input') {
                    handleExcelUpload(e);
                }
            });
            
            // --- INITIAL LOAD ---
            renderUI();
        });
    </script>
</body>
</html>
